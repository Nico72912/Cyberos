<!DOCTYPE html>
<!-- saved from url=(0038)https://hteos.netlify.app/test100.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">



<title>T9 AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
  color: #e8edf7;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#header {
  background: rgba(15, 20, 35, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(76, 195, 255, 0.1);
  padding: 20px 30px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

#logo {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #4cc3ff 0%, #2a8fd9 100%);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 18px;
  color: #0a0e1a;
  box-shadow: 0 4px 15px rgba(76, 195, 255, 0.3);
}

#title {
  font-size: 20px;
  font-weight: 600;
  background: linear-gradient(135deg, #4cc3ff 0%, #99d9ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#chat {
  flex: 1;
  padding: 30px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

#chat::-webkit-scrollbar {
  width: 6px;
}

#chat::-webkit-scrollbar-track {
  background: transparent;
}

#chat::-webkit-scrollbar-thumb {
  background: rgba(76, 195, 255, 0.2);
  border-radius: 10px;
}

#chat::-webkit-scrollbar-thumb:hover {
  background: rgba(76, 195, 255, 0.3);
}

.msg-wrapper {
  display: flex;
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.user-wrapper {
  justify-content: flex-end;
}

.ai-wrapper {
  justify-content: flex-start;
}

.msg {
  max-width: 70%;
  padding: 14px 18px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  position: relative;
  word-wrap: break-word;
}

.user {
  background: linear-gradient(135deg, #4cc3ff 0%, #2a8fd9 100%);
  color: #0a0e1a;
  font-weight: 500;
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 15px rgba(76, 195, 255, 0.3);
}

.ai {
  background: rgba(30, 40, 70, 0.6);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(76, 195, 255, 0.1);
  border-bottom-left-radius: 4px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

#bar {
  display: flex;
  padding: 20px 30px 30px;
  background: rgba(15, 20, 35, 0.8);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(76, 195, 255, 0.1);
  gap: 12px;
}

#input-wrapper {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

input {
  width: 100%;
  padding: 16px 20px;
  border: 2px solid rgba(76, 195, 255, 0.2);
  border-radius: 16px;
  font-size: 15px;
  background: rgba(20, 28, 50, 0.6);
  color: #e8edf7;
  outline: none;
  transition: all 0.3s ease;
  font-family: inherit;
}

input::placeholder {
  color: rgba(232, 237, 247, 0.4);
}

input:focus {
  border-color: rgba(76, 195, 255, 0.5);
  background: rgba(20, 28, 50, 0.8);
  box-shadow: 0 0 0 4px rgba(76, 195, 255, 0.1);
}

button {
  padding: 16px 28px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #4cc3ff 0%, #2a8fd9 100%);
  color: #0a0e1a;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(76, 195, 255, 0.3);
  font-family: inherit;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(76, 195, 255, 0.4);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.typing {
  display: flex;
  gap: 6px;
  padding: 14px 18px;
}

.typing-dot {
  width: 8px;
  height: 8px;
  background: rgba(76, 195, 255, 0.6);
  border-radius: 50%;
  animation: typing 1.4s infinite;
}

.typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes typing {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: 0.6;
  }
  30% {
    transform: translateY(-10px);
    opacity: 1;
  }
}

@media (max-width: 768px) {
  .msg {
    max-width: 85%;
  }
  
  #header {
    padding: 16px 20px;
  }
  
  #bar {
    padding: 16px 20px 20px;
  }
  
  button {
    padding: 16px 20px;
  }
}
</style>
</head>
<body>
<div id="header">
  <div id="logo">T9</div>
  <div id="title">T9 AI Assistant</div>
</div>
<div id="chat"><div class="msg-wrapper ai-wrapper"><div class="msg ai">Hello! I'm T9 AI. How can I help you today?</div></div></div>
<div id="bar">
  <div id="input-wrapper">
    <input id="input" placeholder="Ask me anything...">
  </div>
  <button id="sendBtn" onclick="send()">Send</button>
</div>
